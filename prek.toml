# prek pre-commit configuration (https://prek.j178.dev)
# Run `prek install` to enable Git hooks, or `prek run --all-files` to run manually.

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = [
    "--maxkb=512",
  ] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "oxlint", name = "Oxlint", entry = "bun run lint", language = "system", pass_filenames = false, types_or = [
    "ts",
    "javascript",
    "json",
  ] },
  { id = "oxfmt", name = "Oxfmt format check", entry = "bun run format:check", language = "system", pass_filenames = false, types_or = [
    "ts",
    "javascript",
    "json",
    "toml",
    "yaml",
  ] },
  { id = "typecheck", name = "TypeScript typecheck", entry = "bun run typecheck", language = "system", pass_filenames = false, types_or = [
    "ts",
  ] },
  { id = "bun-test", name = "Bun unit & integration tests", entry = "bun test", language = "system", pass_filenames = false, types_or = [
    "ts",
  ] },
]
